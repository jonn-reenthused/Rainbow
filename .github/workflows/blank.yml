name: Flutter Desktop Build

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies (packages)
        run: |
          dart pub get -C packages/rainbow_assets
          dart pub get -C packages/rainbow_compiler

      - name: Get dependencies (IDE)
        run: flutter pub get
        working-directory: ide

      - name: Analyze packages
        run: |
          dart analyze packages/rainbow_assets
          dart analyze packages/rainbow_compiler

      - name: Analyze IDE
        run: flutter analyze
        working-directory: ide

      - name: Test packages
        run: |
          dart test
        working-directory: packages/rainbow_assets

      - name: Test compiler
        run: |
          dart test
        working-directory: packages/rainbow_compiler

      - name: Test IDE
        run: flutter test
        working-directory: ide

  version:
    needs: analyze_and_test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version, commit and tag
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 '^version: ' ide/pubspec.yaml | awk '{print $2}')
          SEMVER=${CURRENT%%+*}
          if [[ "$CURRENT" == *+* ]]; then BUILD=${CURRENT##*+}; else BUILD=0; fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$SEMVER"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          BUILD=$((BUILD + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD"
          TAG="v$MAJOR.$MINOR.$PATCH"
          sed -i "s/^version: .*/version: $NEW_VERSION/" ide/pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ide/pubspec.yaml
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag "$TAG"
          git push origin "HEAD:${{ github.ref_name }}" "$TAG"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build_desktop:
    needs: [analyze_and_test, version]
    if: >-
      ${{ always() &&
          needs.analyze_and_test.result == 'success' &&
          (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: rainbow-linux-x64
            artifact_file: rainbow-linux-x64.tar.gz
          - os: windows-latest
            target: windows
            artifact_name: rainbow-windows-x64
            artifact_file: rainbow-windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - name: Get dependencies
        run: flutter pub get
        working-directory: ide

      - name: Build desktop target
        run: flutter build ${{ matrix.target }} --release
        working-directory: ide

      - name: Archive Linux bundle
        if: matrix.target == 'linux'
        run: tar -czf ${{ matrix.artifact_file }} -C ide/build/linux/x64/release/bundle .

      - name: Archive Windows build
        if: matrix.target == 'windows'
        run: Compress-Archive -Path "ide/build/windows/x64/runner/Release/*" -DestinationPath "${{ matrix.artifact_file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_file }}

  release:
    needs: [version, build_desktop]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rainbow-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          name: Rainbow ${{ needs.version.outputs.tag }}
          artifacts: artifacts/*
          generateReleaseNotes: true
