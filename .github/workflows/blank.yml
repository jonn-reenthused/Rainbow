name: Flutter Desktop Build

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: write

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies (packages)
        run: |
          dart pub get -C packages/rainbow_assets
          dart pub get -C packages/rainbow_compiler

      - name: Get dependencies (IDE)
        run: flutter pub get
        working-directory: ide

      - name: Analyze packages
        run: |
          dart analyze packages/rainbow_assets
          dart analyze packages/rainbow_compiler

      - name: Analyze IDE
        run: flutter analyze
        working-directory: ide

      - name: Test packages
        run: |
          dart test
        working-directory: packages/rainbow_assets

      - name: Test compiler
        run: |
          dart test
        working-directory: packages/rainbow_compiler

      - name: Test IDE
        run: flutter test
        working-directory: ide

  version:
    needs: analyze_and_test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump version, commit and tag
        id: bump
        run: |
          set -euo pipefail
          CURRENT=$(grep -m1 '^version: ' ide/pubspec.yaml | awk '{print $2}')
          SEMVER=${CURRENT%%+*}
          if [[ "$CURRENT" == *+* ]]; then BUILD=${CURRENT##*+}; else BUILD=0; fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$SEMVER"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          BUILD=$((BUILD + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH+$BUILD"
          TAG="v$MAJOR.$MINOR.$PATCH"
          sed -i "s/^version: .*/version: $NEW_VERSION/" ide/pubspec.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ide/pubspec.yaml
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git tag "$TAG"
          git push origin "HEAD:${{ github.ref_name }}" "$TAG"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build_desktop:
    needs: [analyze_and_test, version]
    if: >-
      ${{ always() &&
          needs.analyze_and_test.result == 'success' &&
          (needs.version.result == 'success' || needs.version.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_name: rainbow-linux-x64
            artifact_file: rainbow-linux-x64.tar.gz
          - os: windows-latest
            target: windows
            artifact_name: rainbow-windows-x64
            artifact_file: rainbow-windows-x64.zip
          - os: macos-latest
            target: macos
            artifact_name: rainbow-macos-arm64
            artifact_file: rainbow-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    env:
      # macOS signing secrets (all optional — absent means unsigned build):
      #   APPLE_CERTIFICATE           base64 of .p12 export of the
      #                               "Developer ID Application" cert+key
      #   APPLE_CERTIFICATE_PASSWORD  .p12 export password
      #   APPLE_ID                    Apple ID email
      #   APPLE_APP_SPECIFIC_PASSWORD app-specific password (appleid.apple.com)
      #   APPLE_TEAM_ID               10-char Apple team ID
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libblkid-dev liblzma-dev

      - name: Get dependencies
        run: flutter pub get
        working-directory: ide

      - name: Build desktop target
        run: flutter build ${{ matrix.target }} --release
        working-directory: ide

      - name: Import signing certificate
        if: matrix.target == 'macos' && env.APPLE_CERTIFICATE != ''
        run: |
          set -e
          KEYCHAIN=build.keychain-db
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          rm cert.p12

      - name: Sign macOS app
        if: matrix.target == 'macos' && env.APPLE_CERTIFICATE != ''
        run: |
          set -e
          IDENTITY="Apple Development: jonn blanchard (jonn blanchard)"
          echo "signing as: $IDENTITY"
          codesign --deep --force --options runtime --timestamp \
            --sign "$IDENTITY" \
            ide/build/macos/Build/Products/Release/rainbow_ide.app
          codesign --verify --deep --strict --verbose=2 \
            ide/build/macos/Build/Products/Release/rainbow_ide.app

      - name: Notarize and staple macOS app
        if: >-
          ${{ matrix.target == 'macos' &&
              env.APPLE_CERTIFICATE != '' &&
              env.APPLE_APP_SPECIFIC_PASSWORD != '' }}
        run: |
          set -e
          cd ide/build/macos/Build/Products/Release
          ditto -c -k --keepParent rainbow_ide.app rainbow_ide.zip
          xcrun notarytool submit rainbow_ide.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple rainbow_ide.app

      - name: Archive Linux bundle
        if: matrix.target == 'linux'
        run: tar -czf ${{ matrix.artifact_file }} -C ide/build/linux/x64/release/bundle .

      - name: Archive Windows build
        if: matrix.target == 'windows'
        run: Compress-Archive -Path "ide/build/windows/x64/runner/Release/*" -DestinationPath "${{ matrix.artifact_file }}"

      - name: Archive macOS app
        if: matrix.target == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent "ide/build/macos/Build/Products/Release/rainbow_ide.app" "${{ matrix.artifact_file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_file }}

  release:
    needs: [version, build_desktop]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rainbow-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.version.outputs.tag }}
          name: Rainbow ${{ needs.version.outputs.tag }}
          artifacts: artifacts/*
          generateReleaseNotes: true
